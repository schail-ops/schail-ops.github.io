@import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Manrope:wght@400;500;600;700&display=swap');
.ds-display{font-family:'Bricolage Grotesque',system-ui,sans-serif;}
.ds-root,.ds-root *{font-family:'Manrope',system-ui,sans-serif;}
.ds-scroll::-webkit-scrollbar{width:8px;height:8px;}
.ds-scroll::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.12);border-radius:8px;}
.ds-scroll::-webkit-scrollbar-track{background:transparent;}
.ds-range{-webkit-appearance:none;appearance:none;width:100%;height:5px;border-radius:5px;background:rgba(255,255,255,0.12);outline:none;}
.ds-range::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:16px;height:16px;border-radius:50%;background:var(--acc);cursor:pointer;box-shadow:0 2px 6px rgba(var(--accRGB),0.5);}
.ds-range::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--acc);border:none;cursor:pointer;}
.ds-card{transition:transform .15s ease, background .15s ease, border-color .15s ease, box-shadow .15s ease;}
.ds-card:hover{transform:translateY(-2px);background:rgba(var(--accRGB),0.14)!important;border-color:rgba(var(--accRGB),0.4)!important;box-shadow:0 8px 22px rgba(var(--accRGB),0.22);}
.ds-hbtn{transition:filter .15s ease, transform .1s ease;}
.ds-hbtn:hover:not(:disabled){filter:brightness(1.25);}
.ds-hbtn:active:not(:disabled){transform:scale(.95);}
.ds-kbd{display:inline-block;padding:1px 7px;border-radius:6px;background:rgba(255,255,255,0.09);border:1px solid rgba(255,255,255,0.16);border-bottom-width:2px;font-size:11px;font-weight:700;color:rgba(233,228,221,0.9);line-height:1.5;}
.ds-d1{animation-delay:.07s}.ds-d2{animation-delay:.14s}.ds-d3{animation-delay:.21s}
.ds-input:focus{border-color:rgba(var(--accRGB),0.6)!important;box-shadow:0 0 0 3px rgba(var(--accRGB),0.16);}
.ds-menu{background:rgba(15,17,24,0.93);backdrop-filter:blur(26px) saturate(150%);-webkit-backdrop-filter:blur(26px) saturate(150%);border:1px solid rgba(255,255,255,0.1);border-top:2px solid rgba(var(--accRGB),0.65);border-radius:16px;box-shadow:0 28px 64px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.06);}
.ds-mi{display:flex;align-items:center;gap:9px;width:100%;padding:8px 10px;border-radius:9px;font-size:13px;color:rgba(233,228,221,0.82);background:transparent;border:none;cursor:pointer;transition:background .12s ease,color .12s ease;text-align:left;}
.ds-mi:hover{background:rgba(var(--accRGB),0.18);color:#fff;}
.ds-mtitle{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:rgba(233,228,221,0.45);padding:4px 10px 8px;font-weight:600;}
@keyframes dsIn{from{opacity:0;transform:translateY(8px) scale(.98);}to{opacity:1;transform:none;}}
.ds-in{animation:dsIn .35s cubic-bezier(.2,.7,.2,1) both;}
